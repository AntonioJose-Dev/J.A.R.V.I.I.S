[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal por voz tipo J.A.R.V.I.S."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,elevenlabs,anthropic,openai,silero,turn-detector,mcp]>=1.8,<2",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21,<23",
    "httpx>=0.25",
    "av>=12",
    "numpy>=1.24",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
pruebas = ["sounddevice>=0.4", "numpy>=1.24", "httpx>=0.25"]

[project.scripts]
jarvis = "jarvis.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
