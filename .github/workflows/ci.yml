name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest   # JARVIS vive en Windows (control del PC, rutas, PowerShell)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Revisión del código (ruff)
        run: python -m ruff check jarvis tests
      - name: Pruebas
        run: python -m pytest -q